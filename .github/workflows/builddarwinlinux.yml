name: Build darwin-vm (Linux)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Модель девайса (iPhone17,3 = iPhone 16, дефолт скрипта)"
        required: false
        default: "iPhone17,3"
      ipsw_url:
        description: "Прямая ссылка на Restore.ipsw (пусто = дефолт из скрипта)"
        required: false
        default: ""

jobs:
  # 1. macOS: патчим ramdisk (hdiutil + codesign только там)
  firmware:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      DEVNAME: ${{ inputs.device || 'iPhone17,3' }}
      URL: ${{ inputs.ipsw_url }}
    steps:
      - name: Install deps
        run: brew install jq ipsw

      - name: Clone darwin-vm
        run: git clone --recurse-submodules https://github.com/jprx/darwin-vm.git

      - name: Fix build_tc.py entrypoint if broken
        working-directory: darwin-vm
        run: |
          sed -i '' 's/^if name=="main":/if __name__ == "__main__":/' build_tc.py || true
          python3 -c "import ast; ast.parse(open('build_tc.py').read())" && echo "build_tc.py OK"

      - name: Make scripts executable
        working-directory: darwin-vm
        run: chmod +x *.sh *.py || chmod +x *.sh

      - name: Get firmware + patched ramdisk
        working-directory: darwin-vm
        run: ./get_files.sh

      - name: Fix perms
        working-directory: darwin-vm
        run: yes y | ./fix_perms.sh firmware/ramdisk.dmg

      - name: Verify
        working-directory: darwin-vm
        run: |
          test -f firmware/ramdisk.dmg
          test -f firmware/ramdisk.tc || { echo "ramdisk.tc missing"; exit 1; }
          echo "firmware OK"

      - name: Pack firmware
        run: tar -czf firmware-patched.tar.gz -C darwin-vm firmware run.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-patched
          path: firmware-patched.tar.gz
          retention-days: 30

  # 2. Linux: собираем QEMU под Linux x86_64
  build-linux:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 jq build-essential ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev \
            zlib1g-dev libffi-dev meson

      - name: Clone darwin-vm
        run: git clone --recurse-submodules https://github.com/jprx/darwin-vm.git

      - name: Download patched firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-patched

      - name: Unpack firmware
        run: tar -xzf firmware-patched.tar.gz -C darwin-vm/

      - name: Verify firmware present
        working-directory: darwin-vm
        run: |
          test -f firmware/ramdisk.dmg
          test -f firmware/ramdisk.tc
          test -f firmware/bootkc
          echo "firmware OK"

      - name: Build QEMU for Linux
        working-directory: darwin-vm/qemu-sptm
        run: |
          git submodule update --init --recursive || true
          mkdir -p build && cd build
          ../configure --target-list=aarch64-softmmu \
                       --disable-pvg \
                       --disable-guest-agent \
                       --enable-slirp
          make -j"$(nproc)"

      - name: Verify QEMU binary
        run: test -x darwin-vm/qemu-sptm/build/qemu-system-aarch64

      - name: Adapt run.sh for Linux
        working-directory: darwin-vm
        run: |
          # hvf -> tcg (на ПК с Linux потом можно руками поставить kvm)
          sed -i 's/hvf/tcg/g' run.sh || true
          chmod +x run.sh
          bash -n run.sh

      - name: Pack Linux artifact
        run: |
          tar -czf darwin-vm-linux.tar.gz \
              -C darwin-vm \
              run.sh \
              firmware \
              qemu-sptm/build/qemu-system-aarch64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-vm-linux-${{ inputs.device || 'iPhone17,3' }}
          path: darwin-vm-linux.tar.gz
          retention-days: 30
