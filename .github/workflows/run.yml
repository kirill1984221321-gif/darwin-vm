name: Run darwin-vm (Tailscale + VNC)

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Ссылка на zip с релиза"
        required: true
        default: "https://github.com/kirill1984221321-gif/darwin-vm/releases/download/1.00/darwin-vm-iPhone17.3.zip"
      run_hours:
        description: "Сколько часов держать ВМ (макс 5)"
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

concurrency:
  group: darwin-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-vm:
    runs-on: macos-latest
    timeout-minutes: 355

    permissions:
      contents: read

    steps:
      - name: Download release
        run: |
          curl -L -o vm.zip "${{ inputs.release_url }}"
          unzip -o vm.zip -d darwin-vm
          find darwin-vm -maxdepth 2 -type f | head -50

      - name: Unpack inner tar.gz
        run: |
          TARFILE=$(find darwin-vm -name "*.tar.gz" | head -1)
          if [ -n "$TARFILE" ]; then
            echo "found inner archive: $TARFILE"
            if tar -tzf "$TARFILE" | head -1 | grep -q '^darwin-vm/'; then
              tar -xzf "$TARFILE" -C .
            else
              tar -xzf "$TARFILE" -C darwin-vm
            fi
          else
            echo "no inner tar.gz, using zip contents as-is"
          fi
          ls -la darwin-vm/ | head -30

      - name: Locate run.sh (safety)
        run: |
          if [ ! -f darwin-vm/run.sh ]; then
            INNER=$(find . -name run.sh -not -path "./noVNC/*" | head -1)
            echo "run.sh found at: $INNER"
            DIRNAME=$(dirname "$INNER")
            mkdir -p darwin-vm
            cp -R "$DIRNAME"/firmware darwin-vm/ 2>/dev/null || true
            cp "$DIRNAME"/run.sh darwin-vm/
            find "$DIRNAME" -name qemu-system-aarch64 -exec cp {} darwin-vm/ \; 2>/dev/null || true
          fi
          test -f darwin-vm/run.sh || { echo "run.sh NOT FOUND"; exit 1; }
          echo "run.sh OK"

      - name: Install dependencies
        run: |
          brew install jq glib pixman gettext ninja python@3.12 libslirp gnutls libusb zstd
          python3 -m pip install --break-system-packages websockify
          git clone https://github.com/novnc/noVNC.git

      - name: Fix dylib paths
        working-directory: darwin-vm
        run: |
          QEMU=$(find . -name qemu-system-aarch64 -type f | head -1)
          echo "qemu at: $QEMU"
          otool -L "$QEMU" | head -40

          # Диагностика: посмотрим, какой data-dir QEMU себе представляет
          echo "=== Возможные пути keymaps внутри бинарника ==="
          strings "$QEMU" 2>/dev/null | grep -i "keymaps" | head -20 || true

          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix)/opt/gettext/lib:$(brew --prefix)/opt/libslirp/lib" >> $GITHUB_ENV

      # ===== ИСПРАВЛЕНО: кладём keymap в место, которое укажем через -L =====
      - name: Fetch QEMU keymaps
        working-directory: darwin-vm
        run: |
          mkdir -p qemu-data/keymaps

          # Скачиваем en-us из официального репозитория QEMU
          curl -fSL -o qemu-data/keymaps/en-us \
            "https://raw.githubusercontent.com/qemu/qemu/master/pc-bios/keymaps/en-us"

          # Проверяем, что файл валидный и непустой
          test -s qemu-data/keymaps/en-us || { echo "en-us не скачался или пустой"; exit 1; }
          echo "=== Размер en-us ==="
          ls -la qemu-data/keymaps/en-us
          echo "=== Первые строки ==="
          head -5 qemu-data/keymaps/en-us

          # На случай, если -L не сработает, продублируем в "типовые" места
          for candidate in \
            "qemu-sptm/build/share/qemu/keymaps" \
            "qemu-sptm/share/qemu/keymaps" \
            "share/qemu/keymaps" \
            "qemu-sptm/build/pc-bios/keymaps"; do
            mkdir -p "$candidate"
            cp qemu-data/keymaps/en-us "$candidate/en-us"
          done
          echo "keymaps разложены"

      # ===== ПРАВКА run.sh: -nographic off, -vnc и -L on, stty fix =====
      - name: Prepare run.sh (fix VNC + keymap path + stty)
        working-directory: darwin-vm
        run: |
          chmod +x run.sh *.sh 2>/dev/null || true

          # 1) Убираем строку с -nographic (она отключает VNC)
          sed -i '' '/^[[:space:]]*-nographic[[:space:]]*$/d' run.sh

          # 2) Добавляем -L ./qemu-data и -vnc 127.0.0.1:1 в массив args после "-m 8G"
          if ! grep -q -- '-vnc' run.sh; then
            perl -0777 -pi -e 's#(-m 8G\n)#$1        -L ./qemu-data\n        -vnc 127.0.0.1:1\n#' run.sh
          fi

          # 3) Подавляем ошибку stty в неинтерактивном режиме
          perl -pi -e 's/stty sane/stty sane 2>\/dev\/null || true/' run.sh

          echo "=== Итоговый run.sh ==="
          cat run.sh

          # Проверки
          grep -q -- '-vnc 127.0.0.1:1' run.sh || { echo "VNC arg NOT inserted"; exit 1; }
          grep -q -- '-L ./qemu-data' run.sh  || { echo "-L arg NOT inserted"; exit 1; }
          if grep -q -- '-nographic' run.sh; then echo "nographic still present"; exit 1; fi
          echo "run.sh готов"

      - name: Silence SEP logs (optional)
        working-directory: darwin-vm
        run: |
          if [ -f silence_logs.py ] && [ -f firmware/bootkc ]; then
            chmod +x silence_logs.py
            ./silence_logs.py firmware/bootkc \
              0xfdb13 b'shared_region: %p [%d(%s)] check_np(0x%llx) vm_shared_region_start_address() returned 0x%x' \
              0x6f7341 b'%s: %s: timed out waiting for AppleSEPManager (timeoutMs=%llu).' \
              0xd19613 b'%s: %s(%d) \x00%s\n%s\x00%s' || echo "silence_logs.py предупредил, продолжаем"
          else
            echo "silence_logs.py или firmware/bootkc не найдены, пропускаем"
          fi

      - name: Fix ramdisk permissions
        working-directory: darwin-vm
        run: |
          if [ -f fix_perms.sh ] && [ -f firmware/ramdisk.dmg ]; then
            chmod +x fix_perms.sh
            ./fix_perms.sh firmware/ramdisk.dmg || echo "fix_perms.sh завершился с предупреждением"
          else
            echo "fix_perms.sh или ramdisk.dmg не найдены, пропускаем"
          fi

      # ===== ПРОБНЫЙ ЗАПУСК: сначала проверяем, что keymap находится =====
      - name: Sanity check QEMU keymap
        working-directory: darwin-vm
        run: |
          # Пустой запуск QEMU только для проверки, что он найдёт keymap.
          # Если увидим ту же ошибку — значит -L не туда смотрит.
          timeout 10 ./qemu-sptm/build/qemu-system-aarch64 \
            -L ./qemu-data \
            -vnc 127.0.0.1:99 \
            -M none -display none 2>&1 | head -20 || true
          echo "--- Проверка завершена (это нормально, что QEMU выругается на -M none) ---"

      - name: Start QEMU VM
        working-directory: darwin-vm
        run: |
          nohup ./run.sh > vm.log 2>&1 &
          QEMU_PID=$!
          echo "VM запущена (PID=$QEMU_PID), ждём VNC порт (макс 120с)..."

          for i in $(seq 1 120); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "!!! QEMU завершился на итерации $i — показываю лог:"
              tail -200 vm.log
              exit 1
            fi

            if nc -z 127.0.0.1 5901 2>/dev/null; then
              echo "VNC port OK (attempt $i)"
              echo "=== Первые строки vm.log ==="
              head -40 vm.log
              exit 0
            fi

            if [ $((i % 5)) -eq 0 ]; then
              echo "--- ${i}s: VNC пока нет, хвост vm.log: ---"
              tail -5 vm.log || true
            fi
            sleep 1
          done

          echo "VNC failed после 120 секунд"
          tail -200 vm.log
          exit 1

      - name: Start noVNC web (port 6080)
        run: |
          nohup python3 noVNC/utils/novnc_proxy --vnc 127.0.0.1:5901 --listen 6080 > novnc.log 2>&1 &
          sleep 5
          nc -z 127.0.0.1 6080 && echo "noVNC OK" || { echo "noVNC failed"; tail -50 novnc.log; exit 1; }

      # ===== TAILSCALE с AUTH KEY =====
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci
          version: latest

      - name: Enable Tailscale SSH (для отладки)
        run: |
          sudo tailscale set --ssh
          echo "=== Tailscale status ==="
          tailscale status
          echo "=== Ваш Tailscale IP ==="
          tailscale ip -4
          echo "=== VNC доступен на: <tailscale-ip>:5901 ==="

      - name: Expose noVNC via Tailscale Serve
        run: |
          tailscale serve --bg --https=443 http://127.0.0.1:6080 || {
            echo "Serve не удался, но VNC всё равно доступен по IP:5901"
            tailscale serve status || true
          }
          echo "=== Tailscale Serve status ==="
          tailscale serve status || true

      - name: Keep VM alive
        run: |
          HOURS=${{ inputs.run_hours }}
          END=$((SECONDS + HOURS * 3600))
          echo "Держим ВМ $HOURS ч (до ${END}s)"

          while [ $SECONDS -lt $END ]; do
            sleep 300
            nc -z 127.0.0.1 5901 || {
              echo "VNC died"
              tail -100 darwin-vm/vm.log
              exit 1
            }
            echo "[$(date -u +%H:%M:%S)] VM alive, tailscale IP: $(tailscale ip -4)"
          done
          echo "Время вышло, завершаем."
